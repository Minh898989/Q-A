version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend-app
    image: web-hk2/backend-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: npm run start
    networks:
      - backend-network

networks:
  backend-network:
    driver: bridge